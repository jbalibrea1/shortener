<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enlace no encontrado</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="text-center px-4">
      <h1 class="text-5xl font-bold text-red-500 mb-4">404</h1>
      <h2 class="text-2xl font-semibold text-gray-700">Enlace no encontrado</h2>
      <p class="text-gray-600 mt-2">
        El enlace que estás buscando no existe o ha caducado.
      </p>
      <a
        href="/"
        class="inline-block mt-6 px-5 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded transition"
      >
        Volver al inicio
      </a>
    </div>
  </body>
</html>
